# 复制为 config.toml 后修改。控制台（console/）会自动生成 data/shooter.toml，手工部署才需要本文件。
dry_run = true                 # 默认模拟运行：只签名并记录，不广播
chain_id = 56
db_path = "data/shooter.db"

[rpc]
http = ["https://bsc-rpc.publicnode.com"]
ws = []                        # 可选，多个 WebSocket 源并行竞速
pending_ws = []                # 可选，支持 newPendingTransactions(full) 的源；strict_same_block 必需
timeout_ms = 1500
backfill_blocks = 64

[executor]
key_file = "data/executor.key" # 权限必须为 0600；或改用 key_env = "SHOOTER_EXECUTOR_KEY"

[budget]
usd_micros = 500000            # 每个任务的执行预算：0.5 USDT
price_max_age_s = 30
min_price_micros = 100000000   # BNB 价格合理区间 100 ~ 5000 USDT，区间外拒绝启动
max_price_micros = 5000000000
buffer_bps = 500
price_pair = "0x16b9a82891338f9bA80E2D6970FddA79D1eb0daE"   # Pancake V2 WBNB/USDT
price_stable = "0x55d398326f99059fF775485246999027B3197955"
include_init_costs = false     # true 时把已登记的部署/授权/建任务费用计入任务预算

[[channels]]
name = "public"
kind = "public"
url = "https://bsc-rpc.publicnode.com"

